# FlowTail settings. Generated from the typed registry.
# Profiles: vanilla, balanced, performance, super-speed, custom.
# R0 = behaviour-identical; R1 = tiny parity risk; R2 = small deviations; R3 = large deviations.

# Behaviour and optimisation profile | risk R0 | restart required: yes
parity-profile=balanced

# Explicit opt-in safety switch | risk R3 | restart required: yes
super-speed-confirm=false

# Threading strategy | risk R0 | restart required: yes
threading.mode=offload

# Background worker thread count | risk R0 | restart required: yes
threading.worker-threads=auto

# Memory available to the server | risk R0 | restart required: yes
hardware.ram-mb=auto

# Logical CPU thread count | risk R0 | restart required: yes
hardware.cpu-threads=auto

# Internet upload speed | risk R0 | restart required: yes
hardware.upload-mbps=auto

# Expected concurrent players | risk R0 | restart required: yes
hardware.expected-max-players=auto

# Java garbage collector | risk R0 | restart required: yes
hardware.gc=auto

# World storage format | risk R0 | restart required: yes
world.format=vanilla

# World generation parity (locked) | risk R0 | restart required: yes
worldgen.parity=exact

# Cache identical chunk packets | risk R0 | restart required: yes
opt.chunk.packet-cache=true

# Use Paper asynchronous chunk IO | risk R0 | restart required: yes
opt.io.async=true

# Batch compatible network packets | risk R0 | restart required: yes
opt.net.packet-batching=true

# Use spatial entity tracking | risk R0 | restart required: yes
opt.tracker.spatial-index=true

# Event-driven hopper checks | risk R1 | restart required: yes
opt.hopper.event-driven=false

# Reduce distant mob activity | risk R2 | restart required: yes
opt.mob.activation-ranges=off

# Throttle distant mob AI | risk R2 | restart required: yes
opt.mob.ai-throttle=off

# Reduce view distance under load | risk R2 | restart required: yes
opt.view-distance.dynamic=false

# Defer lighting work | risk R2 | restart required: yes
opt.light.deferred=false

# Budget random ticks (changes behaviour) | risk R3 | restart required: yes
opt.random-tick.budget=false

# Skip distant entity ticks | risk R3 | restart required: yes
opt.entity.far-tick-skip=false

# Simplify physics (changes behaviour) | risk R3 | restart required: yes
opt.physics.simplified=false

# Emit newline-delimited structured logs | risk R0 | restart required: no
log.structured=true

# Console message filter | risk R0 | restart required: no
log.console.default-filter=all
